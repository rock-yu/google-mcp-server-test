name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hermetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: drive-mcp-server/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r drive-mcp-server/requirements.txt
      - name: Install OpenSpec
        run: npm install --global @fission-ai/openspec@1.14.0
      - name: Run credential-free verification
        run: python verify.py
